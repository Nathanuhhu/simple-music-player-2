name: Build iOS IPA

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.8.0
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies & Generate Code
        run: |
          flutter pub get
          # Run build_runner to generate lib/env/env.g.dart
          dart run build_runner build --delete-conflicting-outputs || true

      - name: Generate Official Flutter Podfile & Patch Target
        run: |
          # 1. Let Flutter generate its official, fully-loaded Podfile
          flutter build ios --config-only --no-codesign
          
          # 2. Patch platform target to 14.0 in-place inside ios/Podfile
          cd ios
          sed -i '' "s/platform :ios, '11.0'/platform :ios, '14.0'/g" Podfile || true
          sed -i '' "s/platform :ios, '12.0'/platform :ios, '14.0'/g" Podfile || true
          sed -i '' "s/# platform :ios, '12.0'/platform :ios, '14.0'/g" Podfile || true
          
          # 3. Update pods
          pod install --repo-update
          cd ..

      - name: Build Unsigned App with xcodebuild
        run: |
          # 1. Prepare Flutter build configurations
          flutter build ios --release --no-codesign --config-only

          # 2. Build native iOS app bundle using xcodebuild
          xcodebuild -workspace ios/Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build/ios_derived \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     build

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r build/ios_derived/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r Simple.Music.Player.ipa Payload
               
      - name: Get Version
        id: version
        run: |
          # Extract version from pubspec.yaml
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Simple.Music.Player.ipa
          path: Simple.Music.Player.ipa
          retention-days: 90
      
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: Simple.Music.Player.ipa
          name: Release version ${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
