name: Build iOS IPA

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.8.0
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Get Dependencies
        run: flutter pub get

      - name: Force Ios 14.0 Deployement Target
        run: |
          cd ios
          pod init || true
          sed -i '' "s/# platform :ios, '9.0'/platform :ios, '14.0'/g" Podfile || true
          sed -i '' "s/# platform :ios, '12.0'/platform :ios, '14.0'/g" Podfile || true
          sed -i '' "s/# platform :ios, '13.0'/platform :ios, '14.0'/g" Podfile || true
          echo "post_install do |installer|" >> Podfile
          echo "  installer.pods_project.targets.each do |target|" >> Podfile
          echo "    flutter_additional_ios_build_settings(target)" >> Podfile
          echo "    target.build_configurations.each do |config|" >> Podfile
          echo "      config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'" >> Podfile
          echo "    end" >> Podfile
          echo "  end" >> Podfile
          echo "end" >> Podfile
          pod install --repo-update
      
      - name: Build iOS (No Codesign)
        run: |
          flutter build ios --release --no-codesign
      
      - name: Create IPA
        run: |
          # Create Payload directory
          mkdir -p Payload
          
          # Copy .app bundle
          cp -r build/ios/iphoneos/Runner.app Payload/
          
          # Create IPA (zip)
          zip -r Simple.Music.Player.ipa Payload
          
      - name: Get Version
        id: version
        run: |
          # Extract version from pubspec.yaml
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Simple.Music.Player.ipa
          path: Simple.Music.Player.ipa
          retention-days: 90
      
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: Simple.Music.Player.ipa
          name: Release version ${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
